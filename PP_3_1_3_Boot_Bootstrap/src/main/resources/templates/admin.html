<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .top-header {
            background-color: #343a40;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar {
            min-height: 100vh;
            background-color: white;
            padding-top: 20px;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #0d6efd;
            margin: 5px 15px;
            padding: 8px 15px;
            border-radius: 4px;
            text-align: left;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }
        .sidebar .nav-link:hover {
            background-color: #e9ecef;
        }
        .sidebar .nav-link.active:hover {
            background-color: #0d6efd;
            color: white;
        }
        .main-content {
            padding: 20px;
        }
        .page-title {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 20px;
        }
        .nav-tabs {
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 20px;
        }
        .nav-tabs .nav-link {
            color: #0d6efd;
            border: none;
            border-bottom: 2px solid transparent;
        }
        .nav-tabs .nav-link.active {
            color: #495057;
            background-color: white;
            border-bottom: 2px solid white;
        }
        .section-header {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border: 1px solid #dee2e6;
            border-bottom: none;
            font-size: 1.1rem;
        }
        .table-container {
            background-color: white;
            border: 1px solid #dee2e6;
            border-top: none;
        }
        .table {
            margin-bottom: 0;
        }
        .table th, .table td {
            border-top: none;
            border-bottom: 1px solid #dee2e6;
            vertical-align: middle;
            padding: 12px;
        }
        .table thead th {
            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
        }


        .table.table-dimmed tbody tr:nth-child(odd) td {
            background-color: #d1d1d1 !important;
            color: #000 !important;
        }

        .table.table-dimmed tbody tr:nth-child(even) td {
            background-color: #ffffff !important;
            color: #000 !important;
        }

        .table.table-dimmed tbody tr:hover td {
            background-color: inherit !important;
        }

        .btn-edit {
            background-color: #17a2b8;
            color: white;
            border: none;
            padding: 4px 12px;
        }
        .btn-edit:hover {
            background-color: #138496;
            color: white;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 4px 12px;
        }
        .btn-delete:hover {
            background-color: #c82333;
            color: white;
        }

        .modal-header {
            background-color: white;
            border-bottom: 1px solid #dee2e6;
            padding: 20px;
        }
        .modal-title {
            font-weight: normal;
            font-size: 1.25rem;
        }
        .modal-body {
            padding: 30px;
        }
        .form-label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            text-align: center;
        }
        .form-control-yellow {
            background-color: #ffeeba;
            border: 1px solid #ced4da;
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            max-width: 220px;
            padding: 8px 12px;
            box-sizing: border-box;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
        .form-control-white {
            background-color: white;
            border: 1px solid #ced4da;
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            max-width: 220px;
            padding: 8px 12px;
            box-sizing: border-box;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
        .form-control-readonly {
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            max-width: 220px;
            padding: 8px 12px;
            box-sizing: border-box;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
        .role-select {
            width: 100%;
            max-width: 220px;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #80bdff;
            background-color: white;
            text-align: left;
            box-sizing: border-box;
            margin-left: auto;
            margin-right: auto;
            display: block;
            height: 64px;
            overflow-y: scroll;
        }
        .role-select::-webkit-scrollbar {
            width: 16px;
        }
        .role-select::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .role-select::-webkit-scrollbar-thumb {
            background: #c1c1c1;
        }
        .role-select option {
            padding: 8px 12px;
            background-color: white;
            color: black;
        }
        .role-select option:checked {
            background-color: #0d6efd;
            color: white;
        }
        .modal-footer {
            border-top: 1px solid #dee2e6;
            justify-content: flex-end;
            gap: 10px;
            padding: 20px;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 20px;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
            color: white;
        }
        .btn-primary {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 8px 20px;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            color: white;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 20px;
        }
    </style>
</head>
<body>

<div class="top-header">
    <div>
        <span th:text="${#authentication.name}">admin@mail.ru</span>
        with roles:
        <span th:each="authority, iterStat : ${#authentication.authorities}">
            <span th:text="${#strings.replace(authority.authority, 'ROLE_', '')}"></span><span th:if="${!iterStat.last}"> </span>
        </span>
    </div>
    <div>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-link text-decoration-none text-white-50">Logout</button>
        </form>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link active" href="/admin">Admin</a>
                <a class="nav-link" href="/user">User</a>
            </nav>
        </div>

        <div class="col-md-10 main-content">
            <h1 class="page-title">Admin panel</h1>

            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link active" href="/admin">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/user/new">New User</a>
                </li>
            </ul>

            <div class="section-header">
                All users
            </div>

            <div class="table-container">
                <table class="table" id="usersTable">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.firstName != null ? user.firstName : ''}"></td>
                        <td th:text="${user.lastName != null ? user.lastName : ''}"></td>
                        <td th:text="${user.age != null ? user.age : ''}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                                <span th:each="role, iterStat : ${user.roles}">
                                    <span th:text="${#strings.replace(role.name, 'ROLE_', '')}"></span><span th:if="${!iterStat.last}"> </span>
                                </span>
                        </td>
                        <td>
                            <button type="button" class="btn btn-edit btn-sm" data-bs-toggle="modal" data-bs-target="#editModal"
                                    th:data-id="${user.id}"
                                    th:data-username="${user.username}"
                                    th:data-firstname="${user.firstName}"
                                    th:data-lastname="${user.lastName}"
                                    th:data-age="${user.age}"
                                    th:data-email="${user.email}"
                                    th:data-roles="${user.roles.![name].toString().replace('[ROLE_', '').replace(']', '').replace('ROLE_', '')}">
                                Edit
                            </button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-delete btn-sm" data-bs-toggle="modal" data-bs-target="#deleteModal"
                                    th:data-id="${user.id}"
                                    th:data-firstname="${user.firstName}"
                                    th:data-lastname="${user.lastName}"
                                    th:data-age="${user.age}"
                                    th:data-email="${user.email}"
                                    th:data-roles="${user.roles.![name].toString().replace('[ROLE_', '').replace(']', '').replace('ROLE_', '')}">
                                Delete
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editForm" th:action="@{/admin/user/save}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="modal-body">
                    <input type="hidden" name="id" id="edit-id">
                    <div>
                        <label class="form-label">ID</label>
                        <input type="text" id="edit-id-display" class="form-control-readonly" readonly>
                    </div>
                    <div>
                        <label class="form-label">First name</label>
                        <input type="text" name="firstName" id="edit-firstname" class="form-control-white" required>
                    </div>
                    <div>
                        <label class="form-label">Last name</label>
                        <input type="text" name="lastName" id="edit-lastname" class="form-control-white" required>
                    </div>
                    <div>
                        <label class="form-label">Age</label>
                        <input type="number" name="age" id="edit-age" class="form-control-white" required>
                    </div>
                    <div>
                        <label class="form-label">Email</label>
                        <input type="email" name="email" id="edit-email" class="form-control-white" required>
                    </div>
                    <div>
                        <label class="form-label">Password</label>
                        <input type="password" name="password" id="edit-password" class="form-control-white">
                    </div>
                    <div>
                        <label class="form-label">Role</label>
                        <select name="role" id="edit-role" class="role-select" size="2">
                            <option value="ADMIN">ADMIN</option>
                            <option value="USER">USER</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="deleteForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="modal-body">
                    <input type="hidden" name="id" id="delete-id">
                    <div>
                        <label class="form-label">ID</label>
                        <input type="text" id="delete-id-display" class="form-control-readonly" readonly>
                    </div>
                    <div>
                        <label class="form-label">First name</label>
                        <input type="text" id="delete-firstname" class="form-control-readonly" readonly>
                    </div>
                    <div>
                        <label class="form-label">Last name</label>
                        <input type="text" id="delete-lastname" class="form-control-readonly" readonly>
                    </div>
                    <div>
                        <label class="form-label">Email</label>
                        <input type="text" id="delete-email" class="form-control-readonly" readonly>
                    </div>
                    <div>
                        <label class="form-label">Role</label>
                        <input type="text" id="delete-role" class="form-control-readonly" readonly>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

    function applyTableDimming() {
        const table = document.getElementById('usersTable');
        if (table) table.classList.add('table-dimmed');
    }

    function removeTableDimming() {
        const table = document.getElementById('usersTable');
        if (table) table.classList.remove('table-dimmed');
    }

    document.addEventListener('DOMContentLoaded', function() {
        const editModal = document.getElementById('editModal');
        const deleteModal = document.getElementById('deleteModal');

        editModal.addEventListener('show.bs.modal', applyTableDimming);
        editModal.addEventListener('hidden.bs.modal', removeTableDimming);
        deleteModal.addEventListener('show.bs.modal', applyTableDimming);
        deleteModal.addEventListener('hidden.bs.modal', removeTableDimming);

        document.querySelectorAll('[data-bs-target="#editModal"]').forEach(button => {
            button.addEventListener('click', function() {
                document.getElementById('edit-id').value = this.getAttribute('data-id');
                document.getElementById('edit-id-display').value = this.getAttribute('data-id');
                document.getElementById('edit-firstname').value = this.getAttribute('data-firstname');
                document.getElementById('edit-lastname').value = this.getAttribute('data-lastname');
                document.getElementById('edit-age').value = this.getAttribute('data-age');
                document.getElementById('edit-email').value = this.getAttribute('data-email');
                const roles = this.getAttribute('data-roles');
                const roleSelect = document.getElementById('edit-role');
                if (roles && roles.includes('ADMIN')) {
                    roleSelect.value = 'ADMIN';
                } else {
                    roleSelect.value = 'USER';
                }
                document.getElementById('edit-password').value = '';
            });
        });

        document.querySelectorAll('[data-bs-target="#deleteModal"]').forEach(button => {
            button.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                const firstName = this.getAttribute('data-firstname');
                const lastName = this.getAttribute('data-lastname');
                const email = this.getAttribute('data-email');
                const roles = this.getAttribute('data-roles');

                document.getElementById('delete-id').value = id;
                document.getElementById('delete-id-display').value = id;
                document.getElementById('delete-firstname').value = firstName;
                document.getElementById('delete-lastname').value = lastName;
                document.getElementById('delete-email').value = email;
                document.getElementById('delete-role').value = roles;

                const deleteForm = document.getElementById('deleteForm');
                deleteForm.action = '/admin/user/delete/' + id;
            });
        });
    });
</script>
</body>
</html>
