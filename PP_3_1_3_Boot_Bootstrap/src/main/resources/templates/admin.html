<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f4f4;
        }
        .top-header {
            background-color: #343a40;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #f4f4f4;
            padding-top: 20px;
        }
        .sidebar .nav-link {
            background-color: #007bff;
            color: white;
            margin: 10px;
            border-radius: 4px;
            text-align: center;
            padding: 10px;
        }
        .sidebar .nav-link:hover {
            background-color: #0056b3;
        }
        .main-content {
            padding: 20px;
        }
        .table-container {
            background-color: white;
            padding: 15px;
        }
        .table th, .table td {
            border-top: none;
        }
        .btn-edit {
            background-color: #17a2b8;
            color: white;
            border: none;
        }
        .btn-edit:hover {
            background-color: #138496;
            color: white;
        }
        .modal-form-control {
            background-color: #fff7c0;
            border: 1px solid #ced4da;
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        .modal-form-control-white {
            background-color: white;
            border: 1px solid #ced4da;
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        .modal-role-select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ced4da;
        }
        .modal-readonly {
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="top-header">
    <div>
        <span th:text="${currentUser.email}">admin@mail.ru</span>
        with roles:
        <span th:each="role, iterStat : ${currentUser.roles}">
            <span th:text="${#strings.replace(role.name, 'ROLE_', '')}"></span><span th:if="${!iterStat.last}"> </span>
        </span>
    </div>
    <div>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-link text-decoration-none text-white-50">Logout</button>
        </form>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link active" href="/admin">Admin</a>
            </nav>
        </div>

        <div class="col-md-10 main-content">
            <h1 class="page-title">Admin panel</h1>

            <div class="table-container">
                <div class="d-flex align-items-center mb-3" style="gap: 20px;">
                    <a href="/admin" class="text-decoration-none" style="color: #0d6efd;">Users table</a>
                    <a href="/admin/user/new" class="text-decoration-none" style="color: #0d6efd;">New User</a>
                </div>

                <h5 class="mb-3">All users</h5>

                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.firstName != null ? user.firstName : ''}"></td>
                        <td th:text="${user.lastName != null ? user.lastName : ''}"></td>
                        <td th:text="${user.age != null ? user.age : ''}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                                <span th:each="role, iterStat : ${user.roles}">
                                    <span th:text="${#strings.replace(role.name, 'ROLE_', '')}"></span><span th:if="${!iterStat.last}"> </span>
                                </span>
                        </td>
                        <td>
                            <button type="button" class="btn btn-edit btn-sm" data-bs-toggle="modal" data-bs-target="#editModal"
                                    th:data-id="${user.id}"
                                    th:data-username="${user.username}"
                                    th:data-firstname="${user.firstName}"
                                    th:data-lastname="${user.lastName}"
                                    th:data-age="${user.age}"
                                    th:data-email="${user.email}"
                                    th:data-roles="${user.roles.![name].toString().replace('[ROLE_', '').replace(']', '').replace('ROLE_', '')}">
                                Edit
                            </button>
                        </td>
                        <td>
                            <button type="button" class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#deleteModal"
                                    th:data-id="${user.id}"
                                    th:data-firstname="${user.firstName}"
                                    th:data-lastname="${user.lastName}"
                                    th:data-age="${user.age}"
                                    th:data-email="${user.email}"
                                    th:data-roles="${user.roles.![name].toString().replace('[ROLE_', '').replace(']', '').replace('ROLE_', '')}">
                                Delete
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editForm" th:action="@{/admin/user/save}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="id" id="edit-id">
                    <div>
                        <label class="form-label">Username</label>
                        <input type="text" name="username" id="edit-username" class="modal-form-control" required>
                    </div>
                    <div>
                        <label class="form-label">First name</label>
                        <input type="text" name="firstName" id="edit-firstname" class="modal-form-control" required>
                    </div>
                    <div>
                        <label class="form-label">Last name</label>
                        <input type="text" name="lastName" id="edit-lastname" class="modal-form-control" required>
                    </div>
                    <div>
                        <label class="form-label">Age</label>
                        <input type="number" name="age" id="edit-age" class="modal-form-control-white" required>
                    </div>
                    <div>
                        <label class="form-label">Email</label>
                        <input type="email" name="email" id="edit-email" class="modal-form-control" required>
                    </div>
                    <div>
                        <label class="form-label">Password</label>
                        <input type="password" name="password" id="edit-password" class="modal-form-control-white" placeholder="Leave empty to keep current">
                    </div>
                    <div>
                        <label class="form-label">Role</label>
                        <select name="role" id="edit-role" class="modal-role-select">
                            <option value="ADMIN">ADMIN</option>
                            <option value="USER">USER</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteModalLabel">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="deleteForm" th:action="@{/admin/user/delete}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="id" id="delete-id">
                    <div>
                        <label class="form-label">ID</label>
                        <input type="text" id="delete-id-display" class="modal-readonly" readonly>
                    </div>
                    <div>
                        <label class="form-label">First name</label>
                        <input type="text" id="delete-firstname" class="modal-readonly" readonly>
                    </div>
                    <div>
                        <label class="form-label">Last name</label>
                        <input type="text" id="delete-lastname" class="modal-readonly" readonly>
                    </div>
                    <div>
                        <label class="form-label">Role</label>
                        <input type="text" id="delete-role" class="modal-readonly" readonly>
                    </div>
                    <div>
                        <label class="form-label">Email</label>
                        <input type="text" id="delete-email" class="modal-readonly" readonly>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('[data-bs-target="#editModal"]').forEach(button => {
        button.addEventListener('click', function() {
            document.getElementById('edit-id').value = this.getAttribute('data-id');
            document.getElementById('edit-username').value = this.getAttribute('data-username');
            document.getElementById('edit-firstname').value = this.getAttribute('data-firstname');
            document.getElementById('edit-lastname').value = this.getAttribute('data-lastname');
            document.getElementById('edit-age').value = this.getAttribute('data-age');
            document.getElementById('edit-email').value = this.getAttribute('data-email');
            const roles = this.getAttribute('data-roles');
            const roleSelect = document.getElementById('edit-role');
            if (roles && roles.includes('ADMIN')) {
                roleSelect.value = 'ADMIN';
            } else {
                roleSelect.value = 'USER';
            }
            document.getElementById('edit-password').value = '';
        });
    });

    document.querySelectorAll('[data-bs-target="#deleteModal"]').forEach(button => {
        button.addEventListener('click', function() {
            const id = this.getAttribute('data-id');
            const firstName = this.getAttribute('data-firstname');
            const lastName = this.getAttribute('data-lastname');
            const email = this.getAttribute('data-email');
            const roles = this.getAttribute('data-roles');
            const age = this.getAttribute('data-age');

            document.getElementById('delete-id').value = id;
            document.getElementById('delete-id-display').value = id;
            document.getElementById('delete-firstname').value = firstName;
            document.getElementById('delete-lastname').value = lastName;
            document.getElementById('delete-email').value = email;
            document.getElementById('delete-role').value = roles;
        });
    });
</script>
</body>
</html>
