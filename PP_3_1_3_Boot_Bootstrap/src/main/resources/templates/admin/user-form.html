<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add new user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .top-header {
            background-color: #343a40;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar {
            min-height: 100vh;
            background-color: white;
            padding-top: 20px;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #0d6efd;
            margin: 5px 15px;
            padding: 8px 15px;
            border-radius: 4px;
            text-align: left;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }
        .sidebar .nav-link:hover {
            background-color: #e9ecef;
        }
        .sidebar .nav-link.active:hover {
            background-color: #0d6efd;
            color: white;
        }
        .main-content {
            padding: 20px;
        }
        .page-title {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 20px;
        }
        .nav-tabs {
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 20px;
        }
        .nav-tabs .nav-link {
            color: #0d6efd;
            border: none;
            border-bottom: 2px solid transparent;
        }
        .nav-tabs .nav-link.active {
            color: #495057;
            background-color: white;
            border-bottom: 2px solid white;
        }
        .section-header {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border: 1px solid #dee2e6;
            border-bottom: none;
            font-size: 1.1rem;
        }
        .form-container {
            background-color: white;
            padding: 30px 40px;
            border: 1px solid #dee2e6;
            border-top: none;
        }
        .form-label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            text-align: center;
        }
        .form-control {
            background-color: white;
            border: 1px solid #ced4da;
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            max-width: 340px;
            padding: 8px 12px;
            box-sizing: border-box;
            margin-left: auto;
            margin-right: auto;
            display: block;
            transition: background-color 0.3s;
        }
        .form-control.filled-from-list {
            background-color: #ffeeba;
        }
        .form-control:focus {
            background-color: white;
            border-color: #80bdff;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
        }
        .form-control::placeholder {
            color: #6c757d;
            opacity: 0.7;
        }

        .autocomplete-wrapper {
            position: relative;
            width: 100%;
            max-width: 340px;
            margin: 0 auto 15px auto;
        }
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ced4da;
            border-top: none;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .autocomplete-dropdown.show {
            display: block;
        }
        .autocomplete-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .autocomplete-item:hover {
            background-color: #f8f9fa;
        }
        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .role-select {
            width: 100%;
            max-width: 340px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            background-color: white;
            text-align: left;
            box-sizing: border-box;
            margin-left: auto;
            margin-right: auto;
            display: block;
            height: 64px;
            padding: 4px 0;
        }

        .role-select option {
            padding: 8px 12px;
            background-color: white;
            color: black;
        }
        .role-select option:hover {
            background-color: #0d6efd;
            color: white;
        }
        .role-select option:checked {
            background-color: white;
            color: black;
        }

        .btn-add {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .btn-add:hover {
            background-color: #218838;
            color: white;
        }
    </style>
</head>
<body>

<div class="top-header">
    <div>
        <span th:text="${#authentication.name}">admin@mail.ru</span>
        with roles:
        <span th:each="authority, iterStat : ${#authentication.authorities}">
            <span th:text="${#strings.replace(authority.authority, 'ROLE_', '')}"></span><span th:if="${!iterStat.last}"> </span>
        </span>
    </div>
    <div>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-link text-decoration-none text-white-50">Logout</button>
        </form>
    </div>
</div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link active" href="/admin">Admin</a>
                <a class="nav-link" href="/user">User</a>
            </nav>
        </div>

        <div class="col-md-10 main-content">
            <h1 class="page-title">Admin panel</h1>

            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link" href="/admin">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/admin/user/new">New User</a>
                </li>
            </ul>

            <div class="section-header">
                Add new user
            </div>

            <div class="form-container">
                <form th:action="@{/admin/user/save}" th:object="${user}" method="post" id="userForm">
                    <input type="hidden" th:field="*{id}">

                    <div>
                        <label class="form-label">First name</label>
                        <div class="autocomplete-wrapper">
                            <input type="text" class="form-control" id="firstName" th:field="*{firstName}" placeholder="First name" required autocomplete="off">
                            <div class="autocomplete-dropdown" id="firstNameDropdown"></div>
                        </div>
                    </div>

                    <div>
                        <label class="form-label">Last name</label>
                        <div class="autocomplete-wrapper">
                            <input type="text" class="form-control" id="lastName" th:field="*{lastName}" placeholder="Last name" required autocomplete="off">
                            <div class="autocomplete-dropdown" id="lastNameDropdown"></div>
                        </div>
                    </div>

                    <div>
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" th:field="*{age}" placeholder="Age" required>
                    </div>

                    <div>
                        <label class="form-label">Email</label>
                        <div class="autocomplete-wrapper">
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Email" required autocomplete="off">
                            <div class="autocomplete-dropdown" id="emailDropdown"></div>
                        </div>
                    </div>

                    <div>
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    </div>

                    <div>
                        <label class="form-label">Role</label>
                        <select name="role" class="role-select" size="2">
                            <option value="ADMIN">ADMIN</option>
                            <option value="USER" selected>USER</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-add">Add new user</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const existingData = {
        firstName: [],
        lastName: [],
        email: []
    };

    function showDropdown(inputId, dropdownId, data) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        const value = input.value.toLowerCase();

        if (value.length === 0) {
            hideDropdown(dropdownId);
            return;
        }

        const filtered = data.filter(item => item.toLowerCase().includes(value));

        if (filtered.length > 0) {
            dropdown.innerHTML = filtered.map(item => `
                <div class="autocomplete-item" onclick="selectItem('${inputId}', '${dropdownId}', '${item}')">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                        <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                    </svg>
                    <span>${item}</span>
                </div>
            `).join('');
            dropdown.classList.add('show');
        } else {
            hideDropdown(dropdownId);
        }
    }

    function hideDropdown(dropdownId) {
        document.getElementById(dropdownId).classList.remove('show');
    }

    function selectItem(inputId, dropdownId, value) {
        const input = document.getElementById(inputId);
        input.value = value;
        input.classList.add('filled-from-list');
        hideDropdown(dropdownId);
    }

    document.addEventListener('DOMContentLoaded', function() {
        const firstNameInput = document.getElementById('firstName');
        firstNameInput.addEventListener('input', function() {
            showDropdown('firstName', 'firstNameDropdown', existingData.firstName);
        });
        firstNameInput.addEventListener('focus', function() {
            if (this.value) {
                showDropdown('firstName', 'firstNameDropdown', existingData.firstName);
            }
        });

        const lastNameInput = document.getElementById('lastName');
        lastNameInput.addEventListener('input', function() {
            showDropdown('lastName', 'lastNameDropdown', existingData.lastName);
        });
        lastNameInput.addEventListener('focus', function() {
            if (this.value) {
                showDropdown('lastName', 'lastNameDropdown', existingData.lastName);
            }
        });

        const emailInput = document.getElementById('email');
        emailInput.addEventListener('input', function() {
            showDropdown('email', 'emailDropdown', existingData.email);
        });
        emailInput.addEventListener('focus', function() {
            if (this.value) {
                showDropdown('email', 'emailDropdown', existingData.email);
            }
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.autocomplete-wrapper')) {
                document.querySelectorAll('.autocomplete-dropdown').forEach(dropdown => {
                    dropdown.classList.remove('show');
                });
            }
        });
    });
</script>
</body>
</html>
